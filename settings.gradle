pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.library' version '8.8.0'
        id 'com.android.test' version '8.8.0'  // For separate test module
        id 'org.jetbrains.kotlin.android' version '2.1.0'
        id 'org.jetbrains.kotlin.kapt' version '2.1.0'
    }
}
rootProject.name = 'Nextcloud'

include ':app'
//`include ':appscan'
include ':scanbot'
